services:
  backend1:
    build: .
    container_name: url-shortener-backend-1
    restart: unless-stopped

    environment:
      PORT: 5000
      APP_URL: http://localhost:5000
      MONGO_URL: mongodb://mongo:27017/urlshortener
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend2:
    build: .
    container_name: url-shortener-backend-2
    restart: unless-stopped

    environment:
      PORT: 5000
      APP_URL: http://localhost:5000
      MONGO_URL: mongodb://mongo:27017/urlshortener
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name : url-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro      

    depends_on:
      - backend1
      - backend2   


  mongo:
    image: mongo:7
    container_name: url-shortener-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5 


  redis: 
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
  redis_data:            