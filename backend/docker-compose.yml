
services:
  backend1:
    build: .
    container_name: url-shortener-backend-1
    restart: unless-stopped

    environment:
      PORT: 5000
      APP_URL: http://localhost
      INSTANCE_ID: backend-1
      CORS_ORIGIN: http://localhost:5173
      MONGO_URL: mongodb://mongo:27017/urlshortener
      REDIS_URL: redis://redis:6379

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend2:
    build: .
    container_name: url-shortener-backend-2
    restart: unless-stopped

    environment:
      PORT: 5000
      APP_URL: http://localhost
      INSTANCE_ID: backend-2
      CORS_ORIGIN: http://localhost:5173
      MONGO_URL: mongodb://mongo:27017/urlshortener
      REDIS_URL: redis://redis:6379

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: url-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: url-shortener-mongo
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  redis_data:
